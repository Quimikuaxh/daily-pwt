<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: dp; src: url(../../public/fonts/pokemon-dp.ttf); }
html,body{margin:0}
body{width:1200px;height:630px;background:#0f1424;background-image:linear-gradient(#ffffff10 2px,transparent 2px),linear-gradient(90deg,#ffffff10 2px,transparent 2px);background-size:64px 64px;font-family:dp;color:#f0f0f0;display:flex;align-items:center;gap:44px;padding:0 56px;box-sizing:border-box;border-bottom:10px solid #c8203c}
.text{flex:1}
.logo{display:flex;align-items:center;gap:20px;font-size:96px;line-height:1;text-shadow:5px 5px 0 #c8203c}
.ball{width:84px;height:84px}
.tag{font-size:38px;line-height:1.3;white-space:nowrap;margin:30px 0 18px;color:#f8c830;text-shadow:3px 3px 0 #000}
.sub{font-size:31px;line-height:1.35;color:#d8d8d8}
.url{font-size:26px;margin-top:26px;color:#9ab}
.shot{width:536px;height:402px;image-rendering:pixelated;border:6px solid #f0f0f0;border-radius:6px;box-shadow:0 0 0 6px #0f1424,10px 10px 0 6px #c8203c}
</style></head><body>
<div class="text">
  <div class="logo"><img class="ball" src="../../public/favicon.svg" alt="">Daily PWT</div>
  <div class="tag">Un combate Pokémon cada día</div>
  <div class="sub">Contra los entrenadores del Pokémon World Tournament de Negro 2 y Blanco 2</div>
  <div class="url">quimikuaxh.github.io/daily-pwt</div>
</div>
<img class="shot" src="combate.png">
</body></html>
