# Validación previa: datos (PRD §8.3), tests unitarios, tipos, lint y build. Se ejecuta en pull requests, en pushes a cualquier rama
# que no sea main y, vía workflow_call, como paso previo obligatorio del despliegue (deploy.yml).
# Sin red hacia fuentes externas y sin scripts/.cache: los tests que comparan con una regeneración que necesita los CSV de PokeAPI
# se omiten con aviso (src/data/generated.test.ts); `npm run validate:data` cubre esos nombres sin la caché.
# Playwright completo no se ejecuta aquí (ver «Tests e2e» en el README: ~10 min en local con 4 workers y sensible a la carga); se lanza en
# local antes de hacer merge. En CI corre solo un humo en Chromium (job e2e-smoke, casos @smoke): Hoy, una partida, el oficial con
# estadísticas y compartir, Ayuda y el build sin ganchos. Unos 3-4 min con la instalación del navegador.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm test
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El navegador sale del CDN de Playwright y se guarda en caché (clave: package-lock, que fija su versión). Las dependencias del
      # sistema van por apt aparte, con límite de tiempo, reintentos y sin tumbar el job: el 11/11/2026 el runner no resolvía los
      # espejos de Ubuntu y `install --with-deps` se colgó 10 min y bloqueó el despliegue. La imagen ubuntu-latest ya trae Chrome con
      # sus librerías; si de verdad faltara alguna, falla el humo y el despliegue sigue bloqueado.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Dependencias del sistema de Chromium (sin bloquear si apt falla)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for i in 1 2 3; do
            timeout 120 npx playwright install-deps chromium && exit 0
            echo "install-deps falló (intento $i)"; sleep 10
          done
          exit 1
      - run: npm run test:e2e:smoke
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
